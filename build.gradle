
plugins {
	id 'java'
}

repositories {
	maven {
		url = 'http://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion
    compileOnly 'org.projectlombok:lombok:1.18.4'
    annotationProcessor 'org.projectlombok:lombok:1.18.4'

    implementation "org.apache.commons:commons-csv:1.4"
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.slf4j:slf4j-simple:1.7.12'
    testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion, {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
    }
}

group = 'com.flippingutilities'
version = '1.4.1'
sourceCompatibility = '1.8'

test {
	// Real-data migration tests load multi-ten-MB account files; the 512m default is too small.
	maxHeapSize = '2g'
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

// Embed the SQLite JDBC driver (classes + native libraries for all platforms) into the
// plugin jar. RuneLite does not provide sqlite-jdbc on the client classpath, so without
// this the plugin would throw ClassNotFoundException at runtime when SQLite mode is used.
// commons-csv is intentionally NOT embedded to preserve the pre-existing packaging shape.
jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
	from {
		configurations.runtimeClasspath
			.findAll { it.name.startsWith('sqlite-jdbc') }
			.collect { zipTree(it) }
	}
}

tasks.register('runPlugin', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.flippingutilities.PluginRunner'
    jvmArgs "-ea"
    args "--developer-mode"
}
